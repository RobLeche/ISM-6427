<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "system"; }
    catch { document.documentElement.dataset.theme = "system"; }
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="app">
    <header class="topbar">
      <p id="greeting" class="greeting">Hello, Rob</p>
      <div class="glass theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="dark">Dark</button>
        <button type="button" data-theme-choice="system">System</button>
      </div>
    </header>

    <form id="search" class="glass search" autocomplete="off">
      <input id="query" type="text" placeholder="Search city…" aria-label="Search city" />
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <section id="alerts" class="alerts" aria-live="polite" hidden></section>

    <section class="glass current">
      <h1 id="place">Boca Raton, FL</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition" class="condition">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass">
      <h2>Hourly Forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>5-Day Forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>

    <section class="details">
      <div class="glass tile"><h2>Feels Like</h2><p id="feels">--</p></div>
      <div class="glass tile"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass tile"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass tile"><h2>UV Index</h2><p id="uv">--</p></div>
    </section>

    <footer>Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>

  <canvas id="windshield" aria-hidden="true"></canvas>

  <button id="weatherman" class="weatherman" type="button" aria-label="Weatherman: tap to show or hide the forecast">
    <span id="weatherman-bubble" class="bubble" role="status" aria-live="polite"></span>
    <svg viewBox="0 0 150 212" aria-hidden="true">
      <!-- Pointer stick in his raised hand -->
      <line x1="137" y1="80" x2="146" y2="14" stroke="#7a5230" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="146" cy="13" r="2.5" fill="#e53935" />
      <!-- Arms -->
      <path d="M14 128 Q8 148 6 166" stroke="#3d3a12" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M14 128 Q8 148 6 166" stroke="#fff35c" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M127 126 Q142 108 137 86" stroke="#3d3a12" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M127 126 Q142 108 137 86" stroke="#fff35c" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <!-- Hands -->
      <g fill="#fff35c" stroke="#3d3a12" stroke-width="1.5">
        <circle cx="6" cy="170" r="6" />
        <circle cx="137" cy="81" r="6.5" />
      </g>
      <!-- Legs, socks and shoes -->
      <g stroke="#3d3a12" stroke-width="1.5">
        <rect x="44" y="168" width="5" height="16" fill="#fff35c" />
        <rect x="92" y="168" width="5" height="16" fill="#fff35c" />
        <rect x="41.5" y="182" width="10" height="14" rx="1" fill="#fff" />
        <rect x="89.5" y="182" width="10" height="14" rx="1" fill="#fff" />
      </g>
      <g stroke-width="2">
        <line x1="42" y1="186" x2="51" y2="186" stroke="#e53935" />
        <line x1="42" y1="190" x2="51" y2="190" stroke="#1e66d0" />
        <line x1="90" y1="186" x2="99" y2="186" stroke="#e53935" />
        <line x1="90" y1="190" x2="99" y2="190" stroke="#1e66d0" />
      </g>
      <ellipse cx="44" cy="202" rx="13" ry="7.5" fill="#111" />
      <ellipse cx="97" cy="202" rx="13" ry="7.5" fill="#111" />
      <ellipse cx="40" cy="199" rx="4" ry="2" fill="#fff" opacity="0.6" />
      <ellipse cx="93" cy="199" rx="4" ry="2" fill="#fff" opacity="0.6" />

      <!-- Sponge body with wavy edges -->
      <path d="M20 12 Q32 3 45 9 Q58 3 70 9 Q83 3 96 9 Q109 3 121 12
               Q128 27 122 42 Q128 57 122 72 Q128 87 122 102 Q127 114 121 124
               L20 124 Q14 114 19 102 Q13 87 19 72 Q13 57 19 42 Q13 27 20 12 Z"
            fill="#fff35c" stroke="#8a8a1a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Sponge holes: dark pit with a lighter rim -->
      <g fill="#c9c227">
        <ellipse cx="30" cy="22" rx="6" ry="8" />
        <ellipse cx="111" cy="24" rx="5" ry="7" />
        <ellipse cx="71" cy="17" rx="3.5" ry="4" />
        <ellipse cx="27" cy="104" rx="6" ry="5" />
        <ellipse cx="112" cy="106" rx="5" ry="7" />
        <ellipse cx="114" cy="62" rx="3" ry="4" />
        <ellipse cx="26" cy="56" rx="2.5" ry="3.5" />
        <ellipse cx="96" cy="112" rx="3" ry="3" />
        <ellipse cx="44" cy="114" rx="2.5" ry="2.5" />
      </g>
      <g fill="#9e9a17">
        <ellipse cx="31" cy="24" rx="4" ry="5.5" />
        <ellipse cx="112" cy="26" rx="3.2" ry="4.6" />
        <ellipse cx="71.5" cy="18" rx="2" ry="2.5" />
        <ellipse cx="28" cy="105.5" rx="4" ry="3.2" />
        <ellipse cx="113" cy="108" rx="3.2" ry="4.6" />
        <ellipse cx="114.5" cy="63" rx="1.8" ry="2.5" />
      </g>

      <!-- Eyelashes -->
      <g stroke="#111" stroke-width="3" stroke-linecap="round">
        <path d="M44 35 L38 26 M53 32 L51 21 M62 33 L64 22" />
        <path d="M80 33 L78 22 M89 32 L91 21 M98 35 L104 26" />
      </g>
      <!-- Eyes -->
      <g stroke="#3d3a12" stroke-width="2">
        <circle cx="55" cy="50" r="17" fill="#fff" />
        <circle cx="87" cy="50" r="17" fill="#fff" />
      </g>
      <circle cx="57.5" cy="52" r="8.5" fill="#3aa0ec" stroke="#1d5f9e" stroke-width="1.5" />
      <circle cx="84.5" cy="52" r="8.5" fill="#3aa0ec" stroke="#1d5f9e" stroke-width="1.5" />
      <circle cx="57.5" cy="52" r="4.2" fill="#111" />
      <circle cx="84.5" cy="52" r="4.2" fill="#111" />
      <circle cx="60" cy="49.5" r="1.8" fill="#fff" />
      <circle cx="87" cy="49.5" r="1.8" fill="#fff" />

      <!-- Rosy cheeks with freckles -->
      <circle cx="33" cy="76" r="8" fill="#f7a1a1" stroke="#d96b6b" stroke-width="1" />
      <circle cx="109" cy="76" r="8" fill="#f7a1a1" stroke="#d96b6b" stroke-width="1" />
      <g fill="#c94f4f">
        <circle cx="30" cy="74" r="1.1" /><circle cx="35" cy="75" r="1.1" /><circle cx="32" cy="79" r="1.1" />
        <circle cx="106" cy="74" r="1.1" /><circle cx="111" cy="75" r="1.1" /><circle cx="108" cy="79" r="1.1" />
      </g>

      <!-- Big toothy grin -->
      <path d="M40 78 Q71 90 102 78 Q96 108 71 110 Q46 108 40 78 Z" fill="#6b1414" stroke="#3d3a12" stroke-width="2" stroke-linejoin="round" />
      <path d="M52 101 Q71 92 90 101 Q82 109 71 110 Q60 109 52 101 Z" fill="#e8737c" />
      <rect x="61" y="84.5" width="9.5" height="11" rx="1.5" fill="#fff" stroke="#3d3a12" stroke-width="1.3" />
      <rect x="71.5" y="84.5" width="9.5" height="11" rx="1.5" fill="#fff" stroke="#3d3a12" stroke-width="1.3" />
      <!-- Dimples -->
      <path d="M38 74 Q35 78 38 82 M104 74 Q107 78 104 82" stroke="#3d3a12" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Long nose -->
      <path d="M68 60 Q66 72 72 74 Q80 74 77 63 Q75 56 71 57 Q68 57 68 60 Z" fill="#fff35c" stroke="#8a8a1a" stroke-width="1.8" />

      <!-- Short sleeves -->
      <path d="M8 124 Q14 116 22 122 L20 132 Q12 134 8 124 Z" fill="#fff" stroke="#888" stroke-width="1.3" />
      <path d="M119 122 Q128 116 134 124 Q130 134 121 132 Z" fill="#fff" stroke="#888" stroke-width="1.3" />
      <!-- White shirt with collar -->
      <rect x="20" y="122" width="101" height="13" fill="#fff" stroke="#888" stroke-width="1.3" />
      <!-- Square pants, belt and pant legs -->
      <rect x="20" y="135" width="101" height="26" fill="#a0632b" stroke="#5d3a1a" stroke-width="1.8" />
      <g fill="#111">
        <rect x="25" y="139" width="12" height="4" /><rect x="42" y="139" width="12" height="4" />
        <rect x="87" y="139" width="12" height="4" /><rect x="104" y="139" width="12" height="4" />
      </g>
      <rect x="34" y="160" width="25" height="10" fill="#a0632b" stroke="#5d3a1a" stroke-width="1.8" />
      <rect x="82" y="160" width="25" height="10" fill="#a0632b" stroke="#5d3a1a" stroke-width="1.8" />
      <!-- Collar and red tie -->
      <path d="M55 122 H70.5 L61 131 Z M70.5 122 H86 L80 131 Z" fill="#fff" stroke="#888" stroke-width="1.3" />
      <path d="M67.5 124 H73.5 L72.5 128 L76 145 L70.5 151 L65 145 L68.5 128 Z" fill="#e0282e" stroke="#8e1b1b" stroke-width="1.3" stroke-linejoin="round" />
    </svg>
  </button>

  <script src="effects.js"></script>
  <script src="weatherman.js"></script>
  <script src="app.js"></script>
</body>
</html>
